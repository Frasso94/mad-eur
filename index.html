<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MAD → EUR" />
  <title>MAD → EUR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --wise-green: #9fe870;
      --wise-green-dark: #7ad44e;
      --wise-navy: #163300;
      --wise-bg: #f8f9fa;
      --wise-white: #ffffff;
      --wise-gray-light: #f0f0f0;
      --wise-gray: #6b7280;
      --wise-gray-dark: #374151;
      --wise-border: #e5e7eb;
      --wise-red: #e53935;
      --wise-text: #1a1a1a;
      --radius: 16px;
      --radius-sm: 10px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--wise-bg);
      color: var(--wise-text);
      overscroll-behavior: none;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: env(safe-area-inset-top, 20px) 0 env(safe-area-inset-bottom, 20px);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    .header {
      width: 100%;
      max-width: 420px;
      padding: 20px 20px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-mark {
      width: 32px;
      height: 32px;
      background: var(--wise-navy);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-mark svg {
      width: 18px;
      height: 18px;
    }

    .logo-text {
      font-size: 16px;
      font-weight: 700;
      color: var(--wise-navy);
      letter-spacing: -0.3px;
    }

    .rate-badge {
      font-size: 11px;
      font-weight: 500;
      color: var(--wise-gray);
      background: var(--wise-white);
      border: 1px solid var(--wise-border);
      border-radius: 20px;
      padding: 4px 10px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .rate-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--wise-green-dark);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── CARD ── */
    .card {
      width: 100%;
      max-width: 420px;
      margin: 20px 20px 0;
      width: calc(100% - 40px);
      background: var(--wise-white);
      border-radius: var(--radius);
      box-shadow: 0 2px 20px rgba(0,0,0,0.06);
      overflow: hidden;
    }

    /* ── CURRENCY FIELDS ── */
    .field {
      padding: 20px 20px 16px;
      position: relative;
      transition: background 0.15s;
    }

    .field:first-of-type {
      border-bottom: 1px solid var(--wise-border);
    }

    .field.active {
      background: #f9fffe;
    }

    .field-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--wise-gray);
      letter-spacing: 0.3px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .field-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .currency-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--wise-gray-light);
      border-radius: 30px;
      padding: 8px 14px 8px 8px;
      flex-shrink: 0;
      cursor: default;
      user-select: none;
    }

    .flag {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      line-height: 1;
    }

    .currency-code {
      font-size: 15px;
      font-weight: 600;
      color: var(--wise-text);
      letter-spacing: 0.2px;
    }

    .amount-wrapper {
      flex: 1;
      overflow: hidden;
    }

    .amount-input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      font-family: 'Inter', sans-serif;
      font-size: 28px;
      font-weight: 600;
      color: var(--wise-text);
      text-align: right;
      letter-spacing: -0.5px;
      caret-color: var(--wise-navy);
      -webkit-appearance: none;
    }

    .amount-input::placeholder {
      color: #d1d5db;
    }

    .amount-input:read-only {
      color: var(--wise-text);
      cursor: default;
    }

    /* ── SWAP BUTTON ── */
    .swap-row {
      display: flex;
      align-items: center;
      padding: 0 20px;
      position: relative;
    }

    .swap-btn {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 38px;
      height: 38px;
      background: var(--wise-white);
      border: 2px solid var(--wise-border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      z-index: 10;
    }

    .swap-btn:active {
      transform: translateX(-50%) scale(0.9);
      background: var(--wise-gray-light);
    }

    .swap-btn svg {
      width: 16px;
      height: 16px;
      color: var(--wise-navy);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .swap-btn.spinning svg {
      transform: rotate(180deg);
    }

    /* ── RATE INFO ── */
    .rate-info {
      padding: 16px 20px 20px;
      border-top: 1px solid var(--wise-border);
    }

    .rate-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .rate-label {
      font-size: 13px;
      color: var(--wise-gray);
      font-weight: 400;
    }

    .rate-value {
      font-size: 13px;
      font-weight: 600;
      color: var(--wise-text);
    }

    .rate-sub {
      margin-top: 6px;
      font-size: 11px;
      color: var(--wise-gray);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ── NUMPAD ── */
    .numpad {
      width: 100%;
      max-width: 420px;
      margin: 16px 20px 0;
      width: calc(100% - 40px);
    }

    .numpad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .key {
      background: var(--wise-white);
      border: none;
      border-radius: var(--radius-sm);
      height: 62px;
      font-family: 'Inter', sans-serif;
      font-size: 22px;
      font-weight: 500;
      color: var(--wise-text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      transition: all 0.12s;
      user-select: none;
      -webkit-user-select: none;
    }

    .key:active {
      transform: scale(0.94);
      background: var(--wise-gray-light);
    }

    .key.key-zero {
      grid-column: span 1;
    }

    .key.key-dot {
      font-size: 26px;
      font-weight: 700;
      color: var(--wise-gray-dark);
    }

    .key.key-del {
      background: var(--wise-gray-light);
      color: var(--wise-gray-dark);
    }

    .key.key-del svg {
      width: 22px;
      height: 22px;
    }

    /* ── FOOTER ── */
    .footer {
      width: 100%;
      max-width: 420px;
      margin: 20px 20px 0;
      width: calc(100% - 40px);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .open-wise-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 16px;
      background: var(--wise-navy);
      color: var(--wise-white);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s;
      letter-spacing: -0.1px;
    }

    .open-wise-btn:active {
      opacity: 0.85;
    }

    .disclaimer {
      text-align: center;
      font-size: 11px;
      color: var(--wise-gray);
      line-height: 1.5;
      padding-bottom: 8px;
    }

    /* ── LOADING ── */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: var(--wise-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      gap: 16px;
      transition: opacity 0.4s;
    }

    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--wise-border);
      border-top-color: var(--wise-navy);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 14px;
      color: var(--wise-gray);
      font-weight: 500;
    }

    /* ── ERROR STATE ── */
    .error-banner {
      width: calc(100% - 40px);
      max-width: 420px;
      background: #fff3f3;
      border: 1px solid #fecdd3;
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-size: 13px;
      color: var(--wise-red);
      display: none;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
    }

    .error-banner.visible {
      display: flex;
    }

    /* ── SHAKE ANIMATION ── */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    .shake {
      animation: shake 0.4s ease;
    }

    /* ── LAST UPDATED ── */
    .updated-time {
      font-size: 11px;
      color: var(--wise-gray);
    }
  </style>
</head>
<body>

  <!-- Loading overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div style="width:44px;height:44px;background:var(--wise-navy);border-radius:12px;display:flex;align-items:center;justify-content:center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 12L10 18L20 6" stroke="#9fe870" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="spinner"></div>
    <span class="loading-text">Caricamento tasso di cambio…</span>
  </div>

  <!-- Header -->
  <div class="header">
    <!--<div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 12L10 18L20 6" stroke="#9fe870" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="logo-text">Wise Converter</span>
    </div>-->
    <div class="rate-badge">
      <span class="rate-dot"></span>
      <span id="liveBadge">Live</span>
    </div>
  </div>

  <!-- Error banner -->
  <div class="error-banner" id="errorBanner">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/><path d="M12 8v4M12 16h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    Impossibile aggiornare il tasso. Uso tasso precedente.
  </div>

  <!-- Converter card -->
  <div class="card" id="converterCard">
    <!-- MAD input -->
    <div class="field active" id="fieldMad">
      <div class="field-label">Invii esattamente</div>
      <div class="field-row">
        <div class="currency-pill">
          <div class="flag">🇲🇦</div>
          <span class="currency-code">MAD</span>
        </div>
        <div class="amount-wrapper">
          <input
            type="text"
            inputmode="none"
            id="madInput"
            class="amount-input"
            placeholder="0"
            readonly
          />
        </div>
      </div>
    </div>

    <!-- Swap zone with divider -->
    <div class="swap-row">
      <button class="swap-btn" id="swapBtn" title="Inverti valute" onclick="handleSwap()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 16V4m0 0L3 8m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4"/>
        </svg>
      </button>
    </div>

    <!-- EUR output -->
    <div class="field" id="fieldEur">
      <div class="field-label">Il destinatario riceve</div>
      <div class="field-row">
        <div class="currency-pill">
          <div class="flag">🇪🇺</div>
          <span class="currency-code">EUR</span>
        </div>
        <div class="amount-wrapper">
          <input
            type="text"
            inputmode="none"
            id="eurOutput"
            class="amount-input"
            placeholder="0,00"
            readonly
            tabindex="-1"
          />
        </div>
      </div>
    </div>

    <!-- Rate info -->
    <div class="rate-info">
      <div class="rate-row">
        <span class="rate-label">Tasso di cambio</span>
        <span class="rate-value" id="rateDisplay">— MAD = 1 EUR</span>
      </div>
      <div class="rate-sub">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        <span id="updatedTime">Aggiornamento in corso…</span>
      </div>
    </div>
  </div>

  <!-- Numpad -->
  <div class="numpad">
    <div class="numpad-grid">
      <button class="key" onclick="numpad('1')">1</button>
      <button class="key" onclick="numpad('2')">2</button>
      <button class="key" onclick="numpad('3')">3</button>
      <button class="key" onclick="numpad('4')">4</button>
      <button class="key" onclick="numpad('5')">5</button>
      <button class="key" onclick="numpad('6')">6</button>
      <button class="key" onclick="numpad('7')">7</button>
      <button class="key" onclick="numpad('8')">8</button>
      <button class="key" onclick="numpad('9')">9</button>
      <button class="key key-zero" onclick="numpad('0')">0</button>
      <button class="key key-dot" onclick="numpad('.')">·</button>
      <button class="key key-del" onclick="numpad('del')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Footer -->
<!--  <div class="footer">
    <a
      href="https://wise.com/it/currency-converter/mad-to-eur-rate"
      target="_blank"
      class="open-wise-btn"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15,3 21,3 21,9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      Apri Wise per trasferire
    </a>
    <div class="disclaimer">
      Tasso mid-market indicativo · Solo a scopo informativo<br/>
      Powered by ExchangeRate-API
    </div>
  </div>-->

<script>
  // ── STATE ──
  let rate = null;          // 1 MAD = X EUR
  let rawValue = '';        // digits typed
  let swapped = false;      // false = MAD→EUR, true = EUR→MAD

  // ── API ──
  async function fetchRate() {
    try {
      // Free tier: exchangerate-api.com (no key needed for this endpoint)
      const res = await fetch('https://api.exchangerate-api.com/v4/latest/MAD');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      rate = data.rates.EUR;
      updateRateDisplay();
      hideError();

      const now = new Date();
      document.getElementById('updatedTime').textContent =
        'Aggiornato alle ' + now.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
    } catch (e) {
      showError();
      if (!rate) {
        // Fallback hardcoded rate if first load fails
        rate = 0.0925; // approximate MAD→EUR
        updateRateDisplay();
        document.getElementById('updatedTime').textContent = 'Tasso di riserva (offline)';
      }
    } finally {
      hideLoading();
    }
  }

  function updateRateDisplay() {
    if (!rate) return;
    const inv = (1 / rate).toFixed(2);
    document.getElementById('rateDisplay').textContent =
      swapped
        ? `1 EUR = ${inv} MAD`
        : `${inv} MAD = 1 EUR`;
    convert();
  }

  // ── NUMPAD ──
  function numpad(key) {
    if (key === 'del') {
      rawValue = rawValue.slice(0, -1);
    } else if (key === '.') {
      if (rawValue.includes('.')) return;
      if (rawValue === '') rawValue = '0';
      rawValue += '.';
    } else {
      if (rawValue.length >= 9) {
        // Shake feedback
        document.getElementById('converterCard').classList.add('shake');
        setTimeout(() => document.getElementById('converterCard').classList.remove('shake'), 400);
        return;
      }
      // Prevent leading zeros
      if (rawValue === '0' && key !== '.') rawValue = key;
      else rawValue += key;
    }
    setInput(rawValue);
    convert();
  }

  function setInput(val) {
    const input = document.getElementById('madInput');
    input.value = formatDisplay(val, false);
  }

  function convert() {
    if (!rate) return;
    const num = parseFloat(rawValue) || 0;
    let result;
    if (!swapped) {
      result = num * rate;
      document.getElementById('madInput').value = formatDisplay(rawValue, false);
      document.getElementById('eurOutput').value = formatDisplay(result.toFixed(2), true);
    } else {
      result = num / rate;
      document.getElementById('madInput').value = formatDisplay(rawValue, false);
      document.getElementById('eurOutput').value = formatDisplay(result.toFixed(2), true);
    }
  }

  function formatDisplay(val, forceDecimals) {
    if (!val && val !== 0) return '';
    const str = val.toString();
    if (str === '' || str === '.') return str;
    const [int, dec] = str.split('.');
    const intFormatted = parseInt(int || '0').toLocaleString('it-IT');
    if (forceDecimals) {
      return intFormatted + ',' + (dec || '00').padEnd(2, '0');
    }
    return dec !== undefined
      ? intFormatted + ',' + dec
      : intFormatted;
  }

  // ── SWAP ──
  function handleSwap() {
    swapped = !swapped;
    const btn = document.getElementById('swapBtn');
    btn.classList.add('spinning');
    setTimeout(() => btn.classList.remove('spinning'), 400);

    // Swap labels
   const label1 = document.getElementById('fieldMad').querySelector('.field-label');
const label2 = document.getElementById('fieldEur').querySelector('.field-label');
if (swapped) {
  label1.textContent = 'Invii esattamente';
  label2.textContent = 'Il destinatario riceve';
} else {
  label1.textContent = 'Invii esattamente';
  label2.textContent = 'Il destinatario riceve';
}

// Swap currency pills
const pill1 = document.getElementById('fieldMad').querySelector('.currency-pill');
const pill2 = document.getElementById('fieldEur').querySelector('.currency-pill');
const flag1 = pill1.querySelector('.flag');
const flag2 = pill2.querySelector('.flag');
const code1 = pill1.querySelector('.currency-code');
const code2 = pill2.querySelector('.currency-code');

const tmpFlag = flag1.textContent;
const tmpCode = code1.textContent;
flag1.textContent = flag2.textContent;
code1.textContent = code2.textContent;
flag2.textContent = tmpFlag;
code2.textContent = tmpCode;

    updateRateDisplay();
  }

  // ── UI HELPERS ──
  function hideLoading() {
    document.getElementById('loadingOverlay').classList.add('hidden');
  }

  function showError() {
    document.getElementById('errorBanner').classList.add('visible');
    setTimeout(() => document.getElementById('errorBanner').classList.remove('visible'), 5000);
  }

  function hideError() {
    document.getElementById('errorBanner').classList.remove('visible');
  }

  // ── INIT ──
  fetchRate();
  // Refresh every 5 minutes
  setInterval(fetchRate, 5 * 60 * 1000);
</script>
</body>
</html>
